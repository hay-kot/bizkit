# cargo-deny checks dependencies for security advisories, licenses, banned
# crates and unknown sources. Run with `mise run deny`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # cookie 0.18.2 comes only through axum-test (a dev dependency), and bizkit
  # never forks. The fix, 0.18.3, came out on 2026-11-23, under the 7-day
  # minimum release age. Remove: bump cookie to 0.18.3 on or after 2026-11-30.
  { id = "RUSTSEC-2026-0594", reason = "dev-only via axum-test; bump cookie to 0.18.3 on or after 2026-11-30" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

# The workspace crates set `publish = false`, so their own licenses are not checked here.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
