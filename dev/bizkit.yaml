# Dev config for `svx up` (and `mise run web:dev`). Anyone at bizkit.test can
# sign up; the first user creates a workspace in the UI. Mail goes to the
# stack's Mailpit through --smtp-url.
log_level: debug
server:
  # Vite's proxy sets X-Forwarded-For (xfwd), so the API sees real client IPs.
  trusted_proxies: 1
  mail:
    from: "bizkit dev <noreply@bizkit.test>"
    # svx sets this variable for the api, so the Mailgun event webhook at
    # /m/mailing/public/events/mailgun takes requests signed with it.
    webhook_signing_key_env: MAILGUN_WEBHOOK_KEY
  # svx sets this dev-only key, so workspaces can save their own mail
  # settings. In development builds a workspace SMTP host may be loopback,
  # so the stack's Mailpit works as a workspace account.
  secrets_key_env: BIZKIT_SECRETS_KEY
  auth:
    policies:
      - name: dev
        matches: ["*@bizkit.test"]
        sign_up: true
  modules:
    analytics:
      # The stack reports its own usage (sign-ins, workspaces, API keys) to
      # the demo workspace's `bizkit` project, which the seed creates.
      self_usage:
        workspace: demo
        project: bizkit
