[package]
name = "bizkit"
description = "Self-hosted business hub for small software companies: analytics, forms, webhooks and document signing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["forms"]
# Feature modules. Each one compiles a module in.
forms = ["dep:bizkit-forms"]
# Test-only routes, the `dev` subcommand and persona seeding. Release builds
# leave it off.
test-hooks = ["bizkit-core/test-hooks"]

[dependencies]
anyhow.workspace = true
bizkit-core.workspace = true
bizkit-forms = { workspace = true, optional = true }
bizkit-web.workspace = true
clap.workspace = true
clap_complete.workspace = true
etcetera.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
assert_cmd = "2"
bizkit-testkit.workspace = true
http.workspace = true
insta.workspace = true
predicates = "3"
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true
